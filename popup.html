<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320">
  <title>Vybit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon-48.png" alt="Vybit" class="logo">
      <h1>Vybit</h1>
    </div>

    <!-- Unauthenticated state -->
    <div id="state-unauth" class="state">
      <p class="status-text">Sign in to receive notifications</p>
      <button id="btn-signin" class="btn btn-primary">Sign In with Vybit</button>
    </div>

    <!-- Connecting state -->
    <div id="state-connecting" class="state hidden">
      <div class="status-indicator connecting"></div>
      <p class="status-text">Connecting...</p>
    </div>

    <!-- Connected state -->
    <div id="state-connected" class="state hidden">
      <div class="status-indicator connected"></div>
      <p class="status-text">Connected — receiving notifications</p>
      <button id="btn-disconnect" class="btn btn-secondary">Disconnect</button>
    </div>

    <!-- Disconnected / reconnecting state -->
    <div id="state-disconnected" class="state hidden">
      <div class="status-indicator disconnected"></div>
      <p class="status-text">Reconnecting...</p>
    </div>

    <!-- Error state -->
    <div id="state-error" class="state hidden">
      <div class="status-indicator error"></div>
      <p id="error-message" class="status-text">Connection error</p>
      <button id="btn-retry" class="btn btn-secondary">Retry</button>
    </div>

  </div>

  <script src="lib/constants.js"></script>
  <script src="lib/auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
